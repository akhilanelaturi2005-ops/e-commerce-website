<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopSphere</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: #b9d1d9; text-align: center; padding-top: 80px; font-family: Arial, sans-serif;">

    <div style="background: white; padding: 40px; display: inline-block; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
        <h1 style="color: #28a745;">ShopSphere</h1>
        <h2>Welcome Back</h2>
        <form id="login-form">
            <input type="email" id="login-email" placeholder="Email Address" required style="display:block; margin: 15px auto; padding: 12px; width: 280px; border: 1px solid #ccc; border-radius: 5px;">
            <input type="password" id="login-password" placeholder="Password" required style="display:block; margin: 15px auto; padding: 12px; width: 280px; border: 1px solid #ccc; border-radius: 5px;">
            <button type="submit" style="background-color: #28a745; color: white; border: none; padding: 12px; width: 305px; cursor: pointer; border-radius: 5px; font-size: 16px; font-weight: bold;">Login</button>
        </form>
        <p style="margin-top: 20px;">New to ShopSphere? <a href="signup.html" style="color: #28a745; text-decoration: none; font-weight: bold;">Sign Up</a></p>
    </div>

    <script src="auth.js"></script>
</body>
</html>
