    <meta charset="UTF-8">

    <title>ShopSphere - mens </title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Men's Collection</h1>
        <a href="index.html">🏠 Home</a> | <a href="cart.html">🛒 Cart</a>
    </header>

    <section class="product-grid">
        <div class="product">
            <img src="mens1.jpeg" alt="Men's T-Shirt">
            <h2>Classic Men's T-Shirt</h2>
            <p>Comfortable cotton t-shirt in various colors.</p>
            <p><strong>Price: $19.99</strong></p>
            <button onclick="addToCart('Classic Men\'s T-Shirt', 19.99)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="mens2.jpeg" alt="Men's Jacket">
            <h2>Stylish Men's Jacket</h2>
            <p>Warm and trendy jacket for all seasons.</p>
            <p><strong>Price: $49.99</strong></p>
            <button onclick="addToCart('Stylish Men\'s Jacket', 49.99)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="mens3.jpeg" alt="Men's Sneakers">
            <h2>Sporty Sneakers</h2>
            <p>Comfortable sneakers for casual and sports use.</p>
            <p><strong>Price: $39.99</strong></p>
            <button onclick="addToCart('Sporty Sneakers', 39.99)">Add to Cart</button>
        </div>
    </section>

    <script src="cart.js"></script>

</body>
</html>
